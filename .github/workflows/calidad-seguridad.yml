# Integración continua (OWASP A08 / A06): pruebas y análisis de dependencias en cada cambio.
# Si se publica una vulnerabilidad en una librería usada, el pull request queda en rojo hasta actualizarla
# (Dependabot propone la actualización: .github/dependabot.yml).
name: Calidad y seguridad

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend · pruebas y dependencias
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Pruebas automatizadas (bloquean si fallan)
        run: pytest -v
      - name: Vulnerabilidades conocidas en dependencias de Python (bloquea si hay)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  frontend:
    name: Frontend · build y dependencias
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Instalar dependencias
        run: npm ci
      - name: Compilar (bloquea si falla)
        run: npm run build
      - name: Vulnerabilidades altas o críticas en dependencias de producción de npm (bloquea si hay)
        run: npm audit --omit=dev --audit-level=high
